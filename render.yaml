services:
  - type: web
    # The deployed service is called ChrisphicsHub, so the book answers at
    # https://chrisphicshub.onrender.com. This name has to match it: a blueprint that invents a
    # second name would stand up a second, empty book beside the shop's.
    name: ChrisphicsHub
    runtime: python
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: python -m py_compile server.py
    startCommand: "python server.py --host 0.0.0.0 --port $PORT --no-browser --trust-proxy"
    healthCheckPath: /healthz
    disk:
      name: crispprint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CHRISPHICS_DB
        value: /var/data/chrisphics.db
      - key: CHRISPHICS_BACKUP_DIR
        value: /var/data/Backups
      # Accra keeps GMT all year and has no daylight saving, so this is the shop's own clock. It has
      # to be said out loud: Render's machines sit in a US zone, and every figure in the book —
      # today's takings, this month's profit, whether the counter is open right now — is read off
      # the server's clock. Left unset, the hosted book files Tuesday's sales under Monday and
      # shuts the shop at noon.
      - key: CHRISPHICS_TZ
        value: GMT
      # No default on purpose. Without a value here the engine refuses to start at all rather than
      # face the internet with no sign-in, and the shop's own word is typed into Render's prompt by
      # the shop — never by this file, and never into the repository.
      - key: CHRISPHICS_AUTH_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
